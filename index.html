<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>FF1 Sim</title>
  <script type="module" src="app.js"></script>
  <link rel="stylesheet" href="styles.css" />

</head>
<body>


  <div class="layout">
    <div class="header">  
        <h1>FF1 Simulator</h1>
    </div> 





    <div class="controls">
      <div class="panel level-and-runs-inputs">
          <label for="maxLevel">Enter Level: </label>
          <input type="number" min="2" step="1" max="50" id="maxLevel" value="50">
          <label for="totalRuns">Number of Runs: </label>
          <input type="number" min="1" step="1" max="100000" id="totalRuns" value="10">
      </div>
      <fieldset class="panel">
        <legend>Class to Simulate</legend>
        <div id="selectClassToSimulate" class="job-picker">

        </div>
      </fieldset>
      <button id="doSimulation">Simulate!</button>
    </div> 
    <div class="results">
      <div aria-live="polite" id="status">

      </div>
      <div id="output">

      </div>

      <div  id="error" role="alert">


      </div>

    </div> 
  </div> 


</body>
</html>
